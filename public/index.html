<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDKS Yönetim & Rapor Paneli</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; color: #333; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; }
        h1 { color: #2c3e50; text-align: center; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 2px solid #eee; padding-bottom: 8px; }
        .card h2 { color: #34495e; font-size: 18px; }
        #qr-box { text-align: center; }
        #qr-img { width: 200px; height: 200px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; }
        .timer { font-size: 14px; color: #e67e22; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; font-size: 14px; }
        th { background-color: #f8f9fa; color: #2c3e50; }
        .btn-delete { background: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .btn-delete:hover { background: #c0392b; }
        .btn-export { background: #27ae60; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; display: inline-flex; align-items: center; gap: 6px; }
        .btn-export:hover { background: #219150; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-success { background: #d4edda; color: #155724; }
        .badge-danger { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📌 PDKS Yönetim & Raporlama Paneli</h1>

        <!-- ÜST İKİLİ IZGARA -->
        <div class="grid">
            <!-- Dynamic QR Kod -->
            <div class="card" id="qr-box">
                <div class="card-header"><h2>📌 Canlı Kapı QR Kodu</h2></div>
                <img id="qr-img" src="" alt="QR Kod Yükleniyor...">
                <div class="timer">Yenilenmesine: <span id="countdown">10</span> sn</div>
            </div>

            <!-- Kayıtlı Personeller -->
            <div class="card">
                <div class="card-header"><h2>👥 Kayıtlı Personeller</h2></div>
                <table>
                    <thead>
                        <tr>
                            <th>Ad Soyad</th>
                            <th>Cihaz Kimliği</th>
                            <th>İşlem</th>
                        </tr>
                    </thead>
                    <tbody id="user-list-body">
                        <tr><td colspan="3">Yükleniyor...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- RAPORLAMA VE EXPORT ALANI -->
        <div class="card">
            <div class="card-header">
                <h2>📊 Giriş - Çıkış Raporu & Veri Aktarımı</h2>
                <button class="btn-export" onclick="exportToCSV()">📥 Raporu Excel / CSV İndir</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Tarih / Saat</th>
                        <th>Personel</th>
                        <th>İşlem Türü</th>
                        <th>Durum</th>
                    </tr>
                </thead>
                <tbody id="log-list-body">
                    <tr><td colspan="4">Kayıtlar yükleniyor...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let countdownVal = 10;
        let allLogs = [];

        async function loadQrCode() {
            try {
                const res = await fetch(`${API_BASE}/api/qr/generate`);
                const data = await res.json();
                const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(data.qr_token)}`;
                document.getElementById('qr-img').src = qrUrl;
                countdownVal = 10;
            } catch (e) {
                console.error("QR yükleme hatası", e);
            }
        }

        async function loadUsers() {
            try {
                const res = await fetch(`${API_BASE}/api/users`);
                const data = await res.json();
                const tbody = document.getElementById('user-list-body');
                tbody.innerHTML = '';

                if (!data.users || data.users.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3">Kayıtlı personel yok.</td></tr>';
                    return;
                }

                data.users.forEach(u => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><strong>${u.full_name}</strong></td>
                        <td><small>${u.device_uuid || 'Atanmadı'}</small></td>
                        <td><button class="btn-delete" onclick="deleteUser(${u.id}, '${u.full_name}')">Sil</button></td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (e) {
                console.error("Personel hatası", e);
            }
        }

        async function deleteUser(id, name) {
            if (!confirm(`${name} isimli personeli silmek istediğinize emin misiniz?`)) return;

            try {
                const res = await fetch(`${API_BASE}/api/users/${id}`, { method: 'DELETE' });
                const data = await res.json();
                if (data.success) {
                    loadUsers();
                    loadLogs();
                }
            } catch (e) {
                alert("Silme hatası.");
            }
        }

        async function loadLogs() {
            try {
                const res = await fetch(`${API_BASE}/api/attendance/logs`);
                const data = await res.json();
                allLogs = data.logs || [];
                const tbody = document.getElementById('log-list-body');
                tbody.innerHTML = '';

                if (allLogs.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4">Henüz giriş/çıkış kaydı yok.</td></tr>';
                    return;
                }

                allLogs.forEach(l => {
                    const tr = document.createElement('tr');
                    const isApproved = l.status === 'APPROVED';
                    tr.innerHTML = `
                        <td>${l.timestamp}</td>
                        <td><strong>${l.full_name}</strong></td>
                        <td>${l.type === 'CHECK_IN' ? 'GİRİŞ 🟢' : 'ÇIKIŞ 🟠'}</td>
                        <td><span class="badge ${isApproved ? 'badge-success' : 'badge-danger'}">${l.status}</span></td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (e) {
                console.error("Log hatası", e);
            }
        }

        function exportToCSV() {
            if (allLogs.length === 0) {
                alert("İndirilecek kayıt bulunamadı.");
                return;
            }

            let csvContent = "\uFEFFTarih/Saat,Personel,Islem Turu,Durum\n";
            allLogs.forEach(l => {
                const typeText = l.type === 'CHECK_IN' ? 'GIRIS' : 'CIKIS';
                csvContent += `"${l.timestamp}","${l.full_name}","${typeText}","${l.status}"\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `PDKS_Raporu_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        loadQrCode();
        loadUsers();
        loadLogs();

        setInterval(() => {
            countdownVal--;
            if (countdownVal <= 0) loadQrCode();
            else document.getElementById('countdown').innerText = countdownVal;
        }, 1000);

        setInterval(() => {
            loadUsers();
            loadLogs();
        }, 5000);
    </script>
</body>
</html>
